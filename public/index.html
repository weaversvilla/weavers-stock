<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="WV Stock"/>
<meta name="theme-color" content="#0a0a0f"/>
<title>Weavers Villa — Stock Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;
  --surface:#12121a;
  --surface2:#1a1a26;
  --surface3:#22223a;
  --border:#2a2a42;
  --accent:#f0a500;
  --accent2:#e05c5c;
  --accent3:#5ce0a0;
  --accent4:#5c9de0;
  --text:#f0f0f8;
  --text2:#9090b0;
  --text3:#5a5a7a;
  --font:'Syne',sans-serif;
  --mono:'JetBrains Mono',monospace;
  --r:8px;
  --r2:14px;
}
html{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh}
body{background:var(--bg);min-height:100vh}

/* Grain overlay */
body::before{
  content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events:none;z-index:9999;opacity:0.6;
}

.app{max-width:1600px;margin:0 auto;padding:24px}

/* Header */
.header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:40px;flex-wrap:wrap;gap:16px}
.logo{display:flex;flex-direction:column;gap:2px}
.logo-name{font-size:28px;font-weight:800;letter-spacing:-0.5px;color:var(--text)}
.logo-sub{font-size:12px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--accent);font-family:var(--mono)}
.header-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:var(--r);font-family:var(--font);font-size:13px;font-weight:700;letter-spacing:0.5px;cursor:pointer;border:none;transition:all 0.15s;text-transform:uppercase}
.btn-primary{background:var(--accent);color:#000}
.btn-primary:hover{background:#f8b820;transform:translateY(-1px)}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{background:var(--accent2);color:#fff}
.btn-sm{padding:7px 14px;font-size:12px}

/* Setup screen */
.setup{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:24px}
.setup-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:40px;width:100%;max-width:480px}
.setup-title{font-size:22px;font-weight:800;margin-bottom:8px}
.setup-sub{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.6}
.input-group{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.input-label{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text2)}
.input{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:12px 16px;color:var(--text);font-family:var(--mono);font-size:13px;width:100%;outline:none;transition:border-color 0.15s}
.input:focus{border-color:var(--accent)}
.input::placeholder{color:var(--text3)}

/* Summary cards */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:28px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:20px 22px;position:relative;overflow:hidden;cursor:pointer;transition:border-color 0.15s,transform 0.15s}
.stat-card:hover{transform:translateY(-2px)}
.stat-card.active-filter{border-color:var(--accent)!important}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.stat-card.oos::before{background:var(--accent2)}
.stat-card.critical::before{background:#f07830}
.stat-card.low::before{background:var(--accent)}
.stat-card.watch::before{background:#a0a0ff}
.stat-card.healthy::before{background:var(--accent3)}
.stat-card.overstock::before{background:#5ca0ff}
.stat-card.dead::before{background:var(--text3)}
.stat-num{font-size:36px;font-weight:800;line-height:1;font-family:var(--mono)}
.stat-card.oos .stat-num{color:var(--accent2)}
.stat-card.critical .stat-num{color:#f07830}
.stat-card.low .stat-num{color:var(--accent)}
.stat-card.watch .stat-num{color:#a0a0ff}
.stat-card.healthy .stat-num{color:var(--accent3)}
.stat-card.overstock .stat-num{color:#5ca0ff}
.stat-card.dead .stat-num{color:var(--text3)}
.stat-label{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);margin-top:6px}

/* Controls */
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;align-items:center}
.search-wrap{position:relative;flex:1;min-width:200px}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px}
.search{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px 10px 36px;color:var(--text);font-family:var(--font);font-size:13px;outline:none}
.search:focus{border-color:var(--accent)}
.filter-btn{padding:9px 16px;border-radius:var(--r);font-family:var(--font);font-size:12px;font-weight:700;letter-spacing:0.5px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text2);transition:all 0.15s;text-transform:uppercase}
.filter-btn.active{background:var(--surface3);border-color:var(--accent);color:var(--accent)}
.filter-btn:hover{border-color:var(--text2);color:var(--text)}

/* Seasonal multiplier */
.seasonal-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 20px;display:flex;align-items:center;gap:20px;margin-bottom:20px;flex-wrap:wrap}
.seasonal-label{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text2)}
.seasonal-val{font-family:var(--mono);font-size:18px;font-weight:700;color:var(--accent);min-width:40px}
.range{accent-color:var(--accent);width:200px;cursor:pointer}

/* Table */
.table-wrap{overflow-x:auto;border-radius:var(--r2);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead{background:var(--surface2)}
th{padding:13px 16px;text-align:left;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);white-space:nowrap;border-bottom:1px solid var(--border)}
th.sortable{cursor:pointer;user-select:none;transition:color 0.15s}
th.sortable:hover{color:var(--text2)}
th.sorted{color:var(--accent)}
.sort-arrow{margin-left:4px;opacity:0.7;font-size:10px}
td{padding:13px 16px;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{background:var(--surface);transition:background 0.1s}
tbody tr:hover{background:var(--surface2)}
tbody tr.dead-stock{opacity:0.85}

.sku{font-family:var(--mono);font-size:12px;color:var(--text2)}
.product-name{font-weight:600;max-width:220px;overflow:hidden;text-overflow:ellipsis}

/* Status badges */
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase}
.badge-dot{width:6px;height:6px;border-radius:50%}
.badge.OUT_OF_STOCK{background:rgba(224,92,92,0.15);color:var(--accent2)}
.badge.OUT_OF_STOCK .badge-dot{background:var(--accent2)}
.badge.CRITICAL{background:rgba(240,120,48,0.15);color:#f07830}
.badge.CRITICAL .badge-dot{background:#f07830}
.badge.LOW{background:rgba(240,165,0,0.15);color:var(--accent)}
.badge.LOW .badge-dot{background:var(--accent)}
.badge.WATCH{background:rgba(160,160,255,0.15);color:#a0a0ff}
.badge.WATCH .badge-dot{background:#a0a0ff}
.badge.HEALTHY{background:rgba(92,224,160,0.12);color:var(--accent3)}
.badge.HEALTHY .badge-dot{background:var(--accent3)}
.badge.OVERSTOCK{background:rgba(92,160,255,0.12);color:#5ca0ff}
.badge.OVERSTOCK .badge-dot{background:#5ca0ff}
.badge.DEAD_STOCK{background:rgba(90,90,122,0.2);color:var(--text3)}
.badge.DEAD_STOCK .badge-dot{background:var(--text3)}

/* Platform pills */
.platform-wrap{display:flex;gap:4px;flex-wrap:wrap}
.platform-pill{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;font-family:var(--mono)}
.platform-pill.amazon{background:rgba(255,153,0,0.15);color:#ff9900}
.platform-pill.amazon_vendor{background:rgba(255,153,0,0.08);color:#ffb733;border:1px solid rgba(255,153,0,0.3)}
.platform-pill.flipkart{background:rgba(47,116,255,0.15);color:#2f74ff}
.platform-pill.myntra{background:rgba(255,63,108,0.15);color:#ff3f6c}
.platform-pill.ajio{background:rgba(0,200,150,0.15);color:#00c896}
.platform-pill.global{background:rgba(180,120,255,0.15);color:#b478ff}
.platform-pill.others{background:rgba(160,160,160,0.15);color:#a0a0a0}

/* Numbers */
.num{font-family:var(--mono);font-size:13px}
.num-highlight{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--accent)}
.num-danger{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--accent2)}
.num-good{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--accent3)}

/* Order qty */
.order-qty{display:inline-flex;align-items:center;justify-content:center;min-width:52px;padding:5px 10px;border-radius:6px;font-family:var(--mono);font-size:13px;font-weight:700}
.order-qty.urgent{background:rgba(224,92,92,0.2);color:var(--accent2);border:1px solid rgba(224,92,92,0.3)}
.order-qty.soon{background:rgba(240,165,0,0.15);color:var(--accent);border:1px solid rgba(240,165,0,0.3)}
.order-qty.planned{background:rgba(92,224,160,0.08);color:var(--accent3);border:1px solid rgba(92,224,160,0.2)}
.order-qty.zero{background:transparent;color:var(--text3)}

/* EOL */
.eol-block{margin-top:32px;border:1px solid #2a2a42;border-radius:var(--r2);overflow:hidden}
.eol-header{background:var(--surface2);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
.eol-title{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text3)}
.eol-count{font-family:var(--mono);font-size:12px;color:var(--text3)}
.btn-eol{padding:3px 10px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:0.5px;cursor:pointer;border:1px solid #3a3a5a;background:transparent;color:var(--text3);transition:all 0.15s;text-transform:uppercase}
.btn-eol:hover{border-color:var(--accent2);color:var(--accent2)}
.btn-eol.active{background:rgba(90,90,122,0.3);border-color:#5a5a7a;color:#8a8aaa}
.badge.EOL{background:rgba(90,90,122,0.15);color:#5a5a7a}
.badge.EOL .badge-dot{background:#5a5a7a}
.spinner{width:48px;height:48px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:var(--text2);font-family:var(--mono);font-size:13px}

/* Timestamps */
.meta-bar{display:flex;align-items:center;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.meta-text{font-family:var(--mono);font-size:12px;color:var(--text3)}
.meta-text span{color:var(--text2)}

/* Error */
.error-box{background:rgba(224,92,92,0.1);border:1px solid rgba(224,92,92,0.3);border-radius:var(--r);padding:16px 20px;color:var(--accent2);font-size:14px;margin:20px 0}

/* Empty */
.empty{text-align:center;padding:60px 20px;color:var(--text3)}

/* Tooltip on hover for name */
td.name-cell{position:relative}
td.name-cell:hover .tooltip{display:block}
.tooltip{display:none;position:absolute;background:#222;border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:12px;white-space:nowrap;z-index:100;top:100%;left:0;color:var(--text)}

@media(max-width:768px){
  .app{padding:12px}
  .header{margin-bottom:20px}
  .logo-name{font-size:22px}
  .summary{grid-template-columns:repeat(3,1fr);gap:8px}
  .stat-card{padding:14px 12px}
  .stat-num{font-size:26px}
  .controls{gap:6px}
  .filter-btn{padding:7px 10px;font-size:11px}
  .seasonal-bar{padding:10px 14px;gap:10px}
  .range{width:120px}

  /* Mobile table — show only essential columns */
  /* Show: Status, SKU, Stock, Days Left, Order Qty */
  /* Hide: Notes, Product name, Velocity, 7d, 15d, 30d, 90d, Platform, Returns */
  th:nth-child(1){display:none} /* Notes */
  td:nth-child(1){display:none}
  th:nth-child(4){display:none} /* Product */
  td:nth-child(4){display:none}
  th:nth-child(8){display:none} /* Stock Value */
  td:nth-child(8){display:none}
  th:nth-child(9){display:none} /* 7d */
  td:nth-child(9){display:none}
  th:nth-child(10){display:none} /* 15d */
  td:nth-child(10){display:none}
  th:nth-child(11){display:none} /* 30d */
  td:nth-child(11){display:none}
  th:nth-child(12){display:none} /* 90d */
  td:nth-child(12){display:none}
  th:nth-child(13){display:none} /* Platform */
  td:nth-child(13){display:none}
  th:nth-child(14){display:none} /* Returns */
  td:nth-child(14){display:none}
  th:nth-child(15){display:none} /* Velocity */
  td:nth-child(15){display:none}

  /* Make remaining columns fit */
  th,td{padding:10px 8px;font-size:12px}
  .badge{font-size:10px;padding:3px 7px}
  .sku{font-size:11px}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useMemo } = React;

const API_BASE_KEY = "wv_api_base";
const HARDCODED_URL = "https://weavers-stock.vercel.app";
const DATA_URL = "/api/data";

const STATUS_LABELS = {
  OUT_OF_STOCK: "Out of Stock",
  CRITICAL:     "Critical",
  LOW:          "Low",
  WATCH:        "Watch",
  HEALTHY:      "Healthy",
  OVERSTOCK:    "Overstock",
  DEAD_STOCK:   "Dead Stock",
};

function CommentCell({ sku, value, onChange, onSave, saving }) {
  const [editing, setEditing] = React.useState(false);
  const inputRef = React.useRef(null);

  React.useEffect(() => {
    if (editing && inputRef.current) inputRef.current.focus();
  }, [editing]);

  const commit = () => {
    onSave(value);
    setEditing(false);
  };

  if (!editing && !value) {
    return (
      <button className="btn-eol" style={{opacity:0.5}} onClick={() => setEditing(true)}>
        + Note
      </button>
    );
  }

  if (!editing) {
    return (
      <div style={{display:"flex",alignItems:"center",gap:6,maxWidth:180}}>
        <span
          onClick={() => setEditing(true)}
          style={{fontSize:12,color:"var(--text2)",cursor:"pointer",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",maxWidth:140}}
          title={value}>
          {value}
        </span>
        <span
          onClick={() => onSave("")}
          title="Delete comment"
          style={{cursor:"pointer",color:"var(--accent2)",fontSize:12,flexShrink:0}}>
          ✕
        </span>
      </div>
    );
  }

  return (
    <input
      ref={inputRef}
      className="input"
      style={{fontFamily:"var(--font)",fontSize:12,padding:"6px 8px",width:160,minWidth:160}}
      value={value}
      placeholder="Add note..."
      onChange={(e) => onChange(e.target.value)}
      onBlur={commit}
      onKeyDown={(e) => { if (e.key === "Enter") commit(); if (e.key === "Escape") setEditing(false); }}
    />
  );
}

function EolBlock({ products, toggleEol, eolSaving }) {
  const [open, setOpen] = React.useState(false);
  return (
    <div className="eol-block">
      <div className="eol-header" onClick={() => setOpen(o => !o)}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <span style={{fontSize:16}}>🚫</span>
          <span className="eol-title">End of Life Products</span>
          <span className="eol-count">{products.length} SKUs</span>
        </div>
        <span style={{color:"var(--text3)",fontSize:12}}>{open ? "▲ Collapse" : "▼ Expand"}</span>
      </div>
      {open && (
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
          <thead>
            <tr style={{background:"var(--surface2)"}}>
              <th style={{padding:"10px 16px",textAlign:"left",fontSize:11,fontWeight:700,letterSpacing:"1.5px",textTransform:"uppercase",color:"var(--text3)"}}>SKU</th>
              <th style={{padding:"10px 16px",textAlign:"left",fontSize:11,fontWeight:700,letterSpacing:"1.5px",textTransform:"uppercase",color:"var(--text3)"}}>Product</th>
              <th style={{padding:"10px 16px",textAlign:"left",fontSize:11,fontWeight:700,letterSpacing:"1.5px",textTransform:"uppercase",color:"var(--text3)"}}>Stock</th>
              <th style={{padding:"10px 16px",textAlign:"left",fontSize:11,fontWeight:700,letterSpacing:"1.5px",textTransform:"uppercase",color:"var(--text3)"}}>Stock Value</th>
              <th style={{padding:"10px 16px",textAlign:"left",fontSize:11,fontWeight:700,letterSpacing:"1.5px",textTransform:"uppercase",color:"var(--text3)"}}>Vel/d</th>
              <th style={{padding:"10px 16px",textAlign:"left",fontSize:11,fontWeight:700,letterSpacing:"1.5px",textTransform:"uppercase",color:"var(--text3)"}}>Platforms</th>
              <th style={{padding:"10px 16px"}}></th>
            </tr>
          </thead>
          <tbody>
            {products.map(p => (
              <tr key={p.sku} style={{background:"var(--surface)",borderBottom:"1px solid var(--border)",opacity:0.7}}>
                <td style={{padding:"11px 16px"}}><span style={{fontFamily:"var(--mono)",fontSize:12,color:"var(--text3)"}}>{p.sku}</span></td>
                <td style={{padding:"11px 16px",color:"var(--text2)"}}>{p.name?.slice(0,40)}{p.name?.length > 40 ? "…" : ""}</td>
                <td style={{padding:"11px 16px",fontFamily:"var(--mono)"}}>{p.currentStock}</td>
                <td style={{padding:"11px 16px",fontFamily:"var(--mono)",color:"var(--text2)"}}>
                  {p.stockValue > 0 ? `₹${p.stockValue.toLocaleString("en-IN")}` : "—"}
                </td>
                <td style={{padding:"11px 16px",fontFamily:"var(--mono)",color:"var(--text3)"}}>{p.dailyVelocity}</td>
                <td style={{padding:"11px 16px"}}>
                  <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
                    {p.platformSales?.amazon > 0 && <span className="platform-pill amazon">AM {p.platformSales.amazon}</span>}
                    {p.platformSales?.flipkart > 0 && <span className="platform-pill flipkart">FL {p.platformSales.flipkart}</span>}
                    {p.platformSales?.myntra > 0 && <span className="platform-pill myntra">MY {p.platformSales.myntra}</span>}
                    {p.platformSales?.ajio > 0 && <span className="platform-pill ajio">AJ {p.platformSales.ajio}</span>}
                    {p.platformSales?.global > 0 && <span className="platform-pill global">GL {p.platformSales.global}</span>}
                  </div>
                </td>
                <td style={{padding:"11px 16px"}}>
                  <button
                    className="btn-eol active"
                    title="Remove EOL flag"
                    onClick={() => toggleEol(p.sku)}
                    disabled={eolSaving}>
                    ✕ Unmark
                  </button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      )}
    </div>
  );
}

function TrendChart() {
  const [open, setOpen]       = React.useState(false);
  const [rows, setRows]       = React.useState(null);
  const [loading, setLoading] = React.useState(false);
  const [err, setErr]         = React.useState(null);

  const load = React.useCallback(async () => {
    if (rows) return; // already loaded
    setLoading(true);
    setErr(null);
    try {
      const res  = await fetch("/api/history");
      const json = await res.json();
      if (json.error) throw new Error(json.error);
      setRows(json.rows || []);
    } catch (e) {
      setErr(e.message);
    } finally {
      setLoading(false);
    }
  }, [rows]);

  const toggle = () => {
    const next = !open;
    setOpen(next);
    if (next) load();
  };

  // Build SVG line chart — no external chart library needed
  const chart = React.useMemo(() => {
    if (!rows || rows.length < 2) return null;

    const W = 900, H = 260, PAD = 40;
    const series = [
      { key: "totalStockValue",   color: "#f0a500", label: "Total" },
      { key: "healthyStockValue", color: "#5ce0a0", label: "Healthy" },
      { key: "overstockValue",    color: "#5ca0ff", label: "Overstock" },
      { key: "deadStockValue",    color: "#e05c5c", label: "Dead Stock" },
    ];

    const maxVal = Math.max(1, ...rows.flatMap(r => series.map(s => r[s.key] || 0)));
    const xStep  = (W - PAD * 2) / (rows.length - 1);
    const yScale = (v) => H - PAD - (v / maxVal) * (H - PAD * 2);
    const xScale = (i) => PAD + i * xStep;

    const paths = series.map(s => {
      const d = rows.map((r, i) => `${i === 0 ? "M" : "L"} ${xScale(i).toFixed(1)} ${yScale(r[s.key] || 0).toFixed(1)}`).join(" ");
      return { ...s, d };
    });

    // Show every Nth date label to avoid crowding
    const labelEvery = Math.ceil(rows.length / 8);

    return { W, H, PAD, paths, rows, xScale, yScale, labelEvery, maxVal };
  }, [rows]);

  return (
    <div className="eol-block" style={{marginTop:16}}>
      <div className="eol-header" onClick={toggle}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <span style={{fontSize:16}}>📈</span>
          <span className="eol-title">Inventory Value Trend</span>
          {rows && <span className="eol-count">{rows.length} days tracked</span>}
        </div>
        <span style={{color:"var(--text3)",fontSize:12}}>{open ? "▲ Collapse" : "▼ Expand"}</span>
      </div>
      {open && (
        <div style={{padding:"20px"}}>
          {loading && <div style={{color:"var(--text3)",fontSize:13}}>Loading history…</div>}
          {err && <div style={{color:"var(--accent2)",fontSize:13}}>⚠ {err}</div>}
          {rows && rows.length < 2 && (
            <div style={{color:"var(--text3)",fontSize:13}}>
              Not enough history yet — need at least 2 days of data. Currently have {rows.length}.
            </div>
          )}
          {chart && (
            <>
              <div style={{display:"flex",gap:20,marginBottom:16,flexWrap:"wrap"}}>
                {chart.paths.map(s => (
                  <div key={s.key} style={{display:"flex",alignItems:"center",gap:6,fontSize:12,color:"var(--text2)"}}>
                    <span style={{width:12,height:3,background:s.color,display:"inline-block",borderRadius:2}}/>
                    {s.label}
                  </div>
                ))}
              </div>
              <svg viewBox={`0 0 ${chart.W} ${chart.H}`} style={{width:"100%",height:"auto"}}>
                {/* Horizontal gridlines */}
                {[0,0.25,0.5,0.75,1].map(f => (
                  <line key={f}
                    x1={chart.PAD} x2={chart.W - chart.PAD}
                    y1={chart.H - chart.PAD - f*(chart.H-chart.PAD*2)}
                    y2={chart.H - chart.PAD - f*(chart.H-chart.PAD*2)}
                    stroke="#2a2a42" strokeWidth="1"/>
                ))}
                {/* Lines */}
                {chart.paths.map(s => (
                  <path key={s.key} d={s.d} fill="none" stroke={s.color} strokeWidth="2.5"/>
                ))}
                {/* X-axis date labels */}
                {chart.rows.map((r, i) => (
                  i % chart.labelEvery === 0 ? (
                    <text key={i} x={chart.xScale(i)} y={chart.H - 12}
                      fontSize="10" fill="#5a5a7a" textAnchor="middle" fontFamily="JetBrains Mono, monospace">
                      {r.date?.slice(5)}
                    </text>
                  ) : null
                ))}
                {/* Y-axis max label */}
                <text x={chart.PAD} y={16} fontSize="10" fill="#5a5a7a" fontFamily="JetBrains Mono, monospace">
                  ₹{chart.maxVal.toLocaleString("en-IN")}
                </text>
              </svg>
            </>
          )}
        </div>
      )}
    </div>
  );
}

function App() {
  // Always use hardcoded URL — no setup screen needed
  const [apiBase] = useState(HARDCODED_URL);
  const [setupDone] = useState(true);
  const [tempBase, setTempBase] = useState("");

  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [lastFetch, setLastFetch] = useState(null);
  const [eolSkus, setEolSkus] = useState(new Set());
  const [eolSaving, setEolSaving] = useState(false);
  const [comments, setComments] = useState({});
  const [commentDraft, setCommentDraft] = useState({});
  const [commentSaving, setCommentSaving] = useState(false);

  // Load EOL list from GitHub via /api/eol
  const fetchEol = useCallback(async () => {
    try {
      const res = await fetch("/api/eol");
      if (res.ok) {
        const json = await res.json();
        setEolSkus(new Set(json.skus || []));
      }
    } catch (e) {
      console.warn("Could not load EOL list:", e.message);
    }
  }, []);

  // Toggle EOL status for a SKU and save to GitHub
  const toggleEol = useCallback(async (sku) => {
    setEolSaving(true);
    const updated = new Set(eolSkus);
    if (updated.has(sku)) updated.delete(sku);
    else updated.add(sku);
    setEolSkus(updated);

    try {
      const res = await fetch("/api/eol", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ skus: Array.from(updated) }),
      });
      if (!res.ok) {
        const json = await res.json().catch(() => null);
        console.warn("Failed to save EOL flag:", json?.error || res.status);
      }
    } catch (e) {
      console.warn("Could not save EOL list:", e.message);
    } finally {
      setEolSaving(false);
    }
  }, [eolSkus]);

  // Load comments from GitHub via /api/comments
  const fetchComments = useCallback(async () => {
    try {
      const res = await fetch("/api/comments");
      if (res.ok) {
        const json = await res.json();
        setComments(json.comments || {});
      }
    } catch (e) {
      console.warn("Could not load comments:", e.message);
    }
  }, []);

  // Save a single SKU's comment (empty string deletes it)
  const saveComment = useCallback(async (sku, text) => {
    setCommentSaving(true);
    const updated = { ...comments };
    const trimmed = (text || "").trim();
    if (trimmed) updated[sku] = trimmed;
    else delete updated[sku];
    setComments(updated);

    try {
      const res = await fetch("/api/comments", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ comments: updated }),
      });
      if (!res.ok) {
        const json = await res.json().catch(() => null);
        console.warn("Failed to save comment:", json?.error || res.status);
      }
    } catch (e) {
      console.warn("Could not save comment:", e.message);
    } finally {
      setCommentSaving(false);
    }
  }, [comments]);

  const [search, setSearch] = useState("");
  const [statusFilter, setStatusFilter] = useState("ALL");
  const [platformFilter, setPlatformFilter] = useState("ALL");
  const [deadFilter, setDeadFilter] = useState(false);
  const [seasonalMult, setSeasonalMult] = useState(1.0);
  const [sortCol, setSortCol] = useState(null);
  const [sortDir, setSortDir] = useState("desc");

  const handleSort = (col) => {
    if (sortCol === col) setSortDir(d => d === "asc" ? "desc" : "asc");
    else { setSortCol(col); setSortDir("desc"); }
  };

  const saveSetup = () => {
    const base = tempBase.trim().replace(/\/$/, "");
    if (!base) return;
    localStorage.setItem(API_BASE_KEY, base);
    setApiBase(base);
    setSetupDone(true);
  };

  const fetchReport = useCallback(async () => {
    setLoading(true);
    setError(null);
    try {
      // Fetch directly from GitHub raw URL — always fresh, bypasses Vercel CDN cache
      const res = await fetch(`${DATA_URL}?t=${Date.now()}`);
      if (res.status === 404) throw new Error("No report data yet. Please run the Python script first to generate today's report.");
      if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
      const json = await res.json();
      if (json.error) throw new Error(json.error);
      setData(json);
      setLastFetch(new Date(json.summary?.generatedAt || Date.now()));

      // Save snapshot for seasonality
      try {
        await fetch(`${apiBase}/api/snapshot`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ products: json.products }),
        });
      } catch {}
    } catch (e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  }, [apiBase]);

  useEffect(() => {
    if (setupDone && apiBase) {
      fetchReport();
      fetchEol();
      fetchComments();
    }
  }, [setupDone]);

  const eolProducts = useMemo(() => {
    if (!data) return [];
    return data.products.filter(p => eolSkus.has(p.sku));
  }, [data, eolSkus]);

  // Recompute summary counts/values live, excluding EOL products,
  // so cards and inventory bar always match what EOL flags currently hide.
  const liveCounts = useMemo(() => {
    if (!data) return null;
    const nonEol = data.products.filter(p => !eolSkus.has(p.sku));
    const statusOf = (p) => (p.isDeadStock && p.status !== "DEAD_STOCK") ? "DEAD_STOCK" : p.status;

    const counts = {
      outOfStock: 0, critical: 0, low: 0, watch: 0, healthy: 0, overstock: 0, deadStock: 0,
      totalStockValue: 0, healthyStockValue: 0, overstockValue: 0, deadStockValue: 0,
    };

    for (const p of nonEol) {
      const s = statusOf(p);
      const val = p.stockValue || 0;
      counts.totalStockValue += val;
      if (s === "OUT_OF_STOCK") counts.outOfStock++;
      else if (s === "CRITICAL") counts.critical++;
      else if (s === "LOW") counts.low++;
      else if (s === "WATCH") counts.watch++;
      else if (s === "HEALTHY") { counts.healthy++; counts.healthyStockValue += val; }
      else if (s === "OVERSTOCK") { counts.overstock++; counts.overstockValue += val; }
      else if (s === "DEAD_STOCK") { counts.deadStock++; counts.deadStockValue += val; }
    }
    return counts;
  }, [data, eolSkus]);

  const filtered = useMemo(() => {
    if (!data) return [];
    let result = data.products.filter((p) => {
      // Exclude EOL products from main table
      if (eolSkus.has(p.sku)) return false;
      // Normalize: treat old isDeadStock=true as DEAD_STOCK status
      const status = (p.isDeadStock && p.status !== "DEAD_STOCK") ? "DEAD_STOCK" : p.status;
      if (statusFilter !== "ALL" && status !== statusFilter) return false;
      if (platformFilter !== "ALL") {
        const plat = platformFilter.toLowerCase();
        if ((p.platformSales?.[plat] || 0) === 0) return false;
      }
      if (search) {
        const s = search.toLowerCase();
        if (!p.name?.toLowerCase().includes(s) && !p.sku?.toLowerCase().includes(s)) return false;
      }
      return true;
    });

    if (sortCol) {
      const dir = sortDir === "asc" ? 1 : -1;
      result = [...result].sort((a, b) => {
        let av, bv;
        switch(sortCol) {
          case "sku":         av = a.sku; bv = b.sku; return dir * av.localeCompare(bv);
          case "name":        av = a.name; bv = b.name; return dir * av.localeCompare(bv);
          case "stock":       av = a.currentStock; bv = b.currentStock; break;
          case "days":        av = a.daysRemaining ?? 9999; bv = b.daysRemaining ?? 9999; break;
          case "velocity":    av = a.dailyVelocity; bv = b.dailyVelocity; break;
          case "d7":          av = a.netSales?.d7 ?? 0; bv = b.netSales?.d7 ?? 0; break;
          case "d15":         av = a.netSales?.d15 ?? 0; bv = b.netSales?.d15 ?? 0; break;
          case "d30":         av = a.netSales?.d30 ?? 0; bv = b.netSales?.d30 ?? 0; break;
          case "d90":         av = a.netSales?.d90 ?? 0; bv = b.netSales?.d90 ?? 0; break;
          case "returns":     av = a.returns?.d30 ?? 0; bv = b.returns?.d30 ?? 0; break;
          case "order":       av = a.suggestedOrder ?? 0; bv = b.suggestedOrder ?? 0; break;
          case "stockValue":  av = a.stockValue ?? 0; bv = b.stockValue ?? 0; break;
          default:            return 0;
        }
        return dir * (av - bv);
      });
    }
    return result;
  }, [data, statusFilter, platformFilter, deadFilter, search, sortCol, sortDir, eolSkus]);

  const exportCSV = () => {
    if (!data) return;
    const totalVal = data.summary.totalStockValue || 1;
    const headers = ["SKU","Name","Stock","Status","Days Left","Velocity/day","7d Sales","15d Sales","30d Sales","90d Sales","Returns 30d","Stock Value","% of Total","Amazon 30d","Amazon Vendor 30d","Flipkart 30d","Myntra 30d","Ajio 30d","Global 30d","Others 30d","Suggested Order"];
    const rows = filtered.map(p => {
      const status = (p.isDeadStock && p.status !== "DEAD_STOCK") ? "DEAD_STOCK" : p.status;
      return [
        p.sku, `"${(p.name||"").replace(/"/g,'""')}"`, p.currentStock, status,
        p.daysRemaining ?? "∞", p.dailyVelocity,
        p.netSales?.d7 ?? 0, p.netSales?.d15 ?? 0, p.netSales?.d30 ?? 0, p.netSales?.d90 ?? 0,
        p.returns?.d30 || 0,
        p.stockValue || 0,
        totalVal > 0 ? (Math.round(1000*(p.stockValue||0)/totalVal)/10)+"%" : "0%",
        p.platformSales?.amazon || 0,
        p.platformSales?.amazon_vendor || 0,
        p.platformSales?.flipkart || 0,
        p.platformSales?.myntra || 0,
        p.platformSales?.ajio || 0,
        p.platformSales?.global || 0,
        p.platformSales?.others || 0,
        Math.ceil((p.suggestedOrder || 0) * seasonalMult),
      ];
    });
    const csv = [headers, ...rows].map(r => r.join(",")).join("\n");
    const blob = new Blob([csv], { type: "text/csv" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `weavers-stock-${new Date().toISOString().split("T")[0]}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  };

  if (!setupDone) {
    return (
      <div className="app">
        <div className="setup">
          <div className="setup-card">
            <div className="logo" style={{marginBottom:24}}>
              <div className="logo-name">Weavers Villa</div>
              <div className="logo-sub">Stock Intelligence</div>
            </div>
            <div className="setup-title">First-time Setup</div>
            <div className="setup-sub">Enter your Vercel deployment URL. This is saved in your browser — you won't be asked again.</div>
            <div className="input-group">
              <label className="input-label">Vercel App URL</label>
              <input
                className="input"
                placeholder="https://weavers-stock.vercel.app"
                value={tempBase}
                onChange={e => setTempBase(e.target.value)}
                onKeyDown={e => e.key === "Enter" && saveSetup()}
              />
            </div>
            <button className="btn btn-primary" style={{width:"100%"}} onClick={saveSetup}>
              Save & Launch Dashboard →
            </button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="app">
      <div className="header">
        <div className="logo">
          <div className="logo-name">Weavers Villa</div>
          <div className="logo-sub">Stock Intelligence</div>
        </div>
        <div className="header-right">
          <button className="btn btn-ghost btn-sm" onClick={exportCSV} disabled={!data}>
            ↓ Export CSV
          </button>
          <button className="btn btn-primary" onClick={fetchReport} disabled={loading}>
            {loading ? "Fetching..." : "↻ Refresh"}
          </button>
        </div>
      </div>

      {error && <div className="error-box">⚠ {error}</div>}

      {!loading && data?.summary?.unmappedGlobalSKUs?.length > 0 && (
        <div style={{background:"rgba(240,165,0,0.1)",border:"1px solid rgba(240,165,0,0.3)",borderRadius:"var(--r)",padding:"12px 16px",marginBottom:16,color:"var(--accent)"}}>
          ⚠ <strong>{data.summary.unmappedGlobalSKUs.length} Global SKUs not mapped</strong> — add to <code>data/global_sku_mapping.xlsx</code>:
          <span style={{fontFamily:"var(--mono)",fontSize:12,marginLeft:8,color:"var(--text2)"}}>
            {data.summary.unmappedGlobalSKUs.slice(0,5).join(", ")}{data.summary.unmappedGlobalSKUs.length > 5 ? ` +${data.summary.unmappedGlobalSKUs.length-5} more` : ""}
          </span>
        </div>
      )}

      {loading && (
        <div className="loading">
          <div className="spinner"/>
          <div className="loading-text">Fetching live data from Baselinker...</div>
        </div>
      )}

      {!loading && data && (
        <>
          {/* Summary */}
          <div className="summary">
            <div className={`stat-card oos ${statusFilter==="OUT_OF_STOCK" && !deadFilter ? "active-filter":""}`}
              onClick={() => { setStatusFilter("OUT_OF_STOCK"); setDeadFilter(false); }}>
              <div className="stat-num">{liveCounts.outOfStock}</div>
              <div className="stat-label">Out of Stock</div>
            </div>
            <div className={`stat-card critical ${statusFilter==="CRITICAL" && !deadFilter ? "active-filter":""}`}
              onClick={() => { setStatusFilter("CRITICAL"); setDeadFilter(false); }}>
              <div className="stat-num">{liveCounts.critical}</div>
              <div className="stat-label">Critical &lt;7d</div>
            </div>
            <div className={`stat-card low ${statusFilter==="LOW" && !deadFilter ? "active-filter":""}`}
              onClick={() => { setStatusFilter("LOW"); setDeadFilter(false); }}>
              <div className="stat-num">{liveCounts.low}</div>
              <div className="stat-label">Low &lt;15d</div>
            </div>
            <div className={`stat-card watch ${statusFilter==="WATCH" && !deadFilter ? "active-filter":""}`}
              onClick={() => { setStatusFilter("WATCH"); setDeadFilter(false); }}>
              <div className="stat-num">{liveCounts.watch}</div>
              <div className="stat-label">Watch &lt;30d</div>
            </div>
            <div className={`stat-card healthy ${statusFilter==="HEALTHY" && !deadFilter ? "active-filter":""}`}
              onClick={() => { setStatusFilter("HEALTHY"); setDeadFilter(false); }}>
              <div className="stat-num">{liveCounts.healthy}</div>
              <div className="stat-label">Healthy</div>
            </div>
            <div className={`stat-card overstock ${statusFilter==="OVERSTOCK" && !deadFilter ? "active-filter":""}`}
              onClick={() => { setStatusFilter("OVERSTOCK"); setDeadFilter(false); }}>
              <div className="stat-num">{liveCounts.overstock}</div>
              <div className="stat-label">Overstock &gt;365d</div>
            </div>
            <div className={`stat-card dead ${statusFilter==="DEAD_STOCK" && !deadFilter ? "active-filter":""}`}
              onClick={() => { setStatusFilter("DEAD_STOCK"); setDeadFilter(false); }}>
              <div className="stat-num">{liveCounts.deadStock}</div>
              <div className="stat-label">Dead Stock</div>
            </div>
          </div>

          {/* Inventory Value Bar */}
          {(() => {
            const total   = liveCounts.totalStockValue;
            const healthy = liveCounts.healthyStockValue;
            const over    = liveCounts.overstockValue;
            const dead    = liveCounts.deadStockValue;
            return (
          <div className="seasonal-bar" style={{marginBottom:20,gap:0,justifyContent:"flex-start"}}>
            <span className="seasonal-label" style={{marginRight:20}}>📦 Total Inventory Value</span>
            <div style={{display:"flex",alignItems:"baseline",gap:6,marginRight:28}}>
              <span style={{fontFamily:"var(--mono)",fontSize:20,fontWeight:700,color:"var(--accent)"}}>₹{total.toLocaleString("en-IN")}</span>
              <span style={{fontSize:11,color:"var(--text3)",letterSpacing:1,textTransform:"uppercase"}}>Total</span>
            </div>
            <div style={{display:"flex",alignItems:"baseline",gap:6,marginRight:28}}>
              <span style={{fontFamily:"var(--mono)",fontSize:20,fontWeight:700,color:"var(--accent3)"}}>₹{healthy.toLocaleString("en-IN")}</span>
              <span style={{fontSize:11,fontWeight:700,color:"var(--accent3)"}}>{total ? Math.round(100*healthy/total) : 0}%</span>
              <span style={{fontSize:11,color:"var(--text3)",letterSpacing:1,textTransform:"uppercase"}}>Healthy</span>
            </div>
            <div style={{display:"flex",alignItems:"baseline",gap:6,marginRight:28}}>
              <span style={{fontFamily:"var(--mono)",fontSize:20,fontWeight:700,color:"#5ca0ff"}}>₹{over.toLocaleString("en-IN")}</span>
              <span style={{fontSize:11,fontWeight:700,color:"#5ca0ff"}}>{total ? Math.round(100*over/total) : 0}%</span>
              <span style={{fontSize:11,color:"var(--text3)",letterSpacing:1,textTransform:"uppercase"}}>Overstock</span>
            </div>
            <div style={{display:"flex",alignItems:"baseline",gap:6}}>
              <span style={{fontFamily:"var(--mono)",fontSize:20,fontWeight:700,color:"var(--accent2)"}}>₹{dead.toLocaleString("en-IN")}</span>
              <span style={{fontSize:11,fontWeight:700,color:"var(--accent2)"}}>{total ? Math.round(100*dead/total) : 0}%</span>
              <span style={{fontSize:11,color:"var(--text3)",letterSpacing:1,textTransform:"uppercase"}}>Dead Stock</span>
            </div>
          </div>
            );
          })()}

          {/* Seasonal multiplier */}
          <div className="seasonal-bar">
            <span className="seasonal-label">🌿 Seasonal Multiplier</span>
            <span className="seasonal-val">{seasonalMult.toFixed(1)}×</span>
            <input
              type="range" className="range"
              min="0.5" max="5" step="0.1"
              value={seasonalMult}
              onChange={e => setSeasonalMult(parseFloat(e.target.value))}
            />
            <span style={{fontSize:12,color:"var(--text3)"}}>
              {seasonalMult === 1 ? "Normal season" : seasonalMult > 2 ? "🧣 Peak winter mode" : "Adjusted"}
            </span>
          </div>

          {/* Meta */}
          <div className="meta-bar">
            <span className="meta-text">Report generated: <span>{lastFetch?.toLocaleString("en-IN", {timeZone:"Asia/Kolkata", day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit"})}</span></span>
            <span className="meta-text">Showing: <span>{filtered.length} / {data.products.length - eolSkus.size} SKUs</span></span>
            {eolSkus.size > 0 && <span className="meta-text">({eolSkus.size} EOL hidden)</span>}
            {seasonalMult !== 1 && <span className="meta-text" style={{color:"var(--accent)"}}>Seasonal {seasonalMult}× applied to order suggestions</span>}
          </div>

          {/* Controls */}
          <div className="controls">
            <div className="search-wrap">
              <span className="search-icon">⌕</span>
              <input className="search" placeholder="Search by name or SKU..." value={search} onChange={e => setSearch(e.target.value)}/>
            </div>
            {["ALL","OUT_OF_STOCK","CRITICAL","LOW","WATCH","HEALTHY","OVERSTOCK","DEAD_STOCK"].map(s => (
              <button key={s} className={`filter-btn ${statusFilter===s && !deadFilter ? "active":""}`}
                onClick={() => { setStatusFilter(s); setDeadFilter(false); }}>
                {s === "ALL" ? "All" : STATUS_LABELS[s] || s}
              </button>
            ))}
          </div>

          {/* Platform filter */}
          <div className="controls" style={{marginBottom:16}}>
            <span style={{fontSize:12,color:"var(--text3)",fontWeight:700,letterSpacing:1,textTransform:"uppercase"}}>Platform:</span>
            {["ALL","amazon","amazon_vendor","flipkart","myntra","ajio","global","others"].map(p => (
              <button key={p} className={`filter-btn ${platformFilter===p ? "active":""}`}
                onClick={() => setPlatformFilter(p)}>
                {p === "ALL" ? "All Platforms" : p === "amazon_vendor" ? "Amazon Vendor" : p === "global" ? "🌐 Global" : p.charAt(0).toUpperCase()+p.slice(1)}
              </button>
            ))}
          </div>

          {/* Table */}
          <div className="table-wrap">
            <table>
              <thead>
                <tr>
                  {[
                    ["Notes",      null],
                    ["Status",     null],
                    ["SKU",        "sku"],
                    ["Product",    "name"],
                    ["Stock",      "stock"],
                    ["Days Left",  "days"],
                    ["Order Qty",  "order"],
                    ["Stock Value","stockValue"],
                    ["7d Net",     "d7"],
                    ["15d Net",    "d15"],
                    ["30d Net",    "d30"],
                    ["90d Net",    "d90"],
                    ["Platform 30d", null],
                    ["Returns 30d", "returns"],
                    ["Velocity/d", "velocity"],
                    ["",           null],
                  ].map(([label, col]) => (
                    <th key={label}
                      className={col ? `sortable${sortCol===col ? " sorted":""}` : ""}
                      onClick={() => col && handleSort(col)}>
                      {label}
                      {col && <span className="sort-arrow">
                        {sortCol===col ? (sortDir==="asc" ? " ↑" : " ↓") : " ↕"}
                      </span>}
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {filtered.length === 0 && (
                  <tr><td colSpan={16} className="empty">No products match the current filters</td></tr>
                )}
                {filtered.map(p => {
                  const status = (p.isDeadStock && p.status !== "DEAD_STOCK") ? "DEAD_STOCK" : p.status;
                  const adjOrder = Math.ceil((p.suggestedOrder || 0) * seasonalMult);
                  const orderClass = status === "OUT_OF_STOCK" || status === "CRITICAL" ? "urgent"
                    : status === "LOW" ? "soon"
                    : status === "WATCH" ? "planned"
                    : "zero";

                  return (
                    <tr key={p.productId} className={status === "DEAD_STOCK" ? "dead-stock" : ""}>
                      <td>
                        <CommentCell
                          sku={p.sku}
                          value={commentDraft[p.sku] ?? comments[p.sku] ?? ""}
                          onChange={(v) => setCommentDraft(d => ({ ...d, [p.sku]: v }))}
                          onSave={(v) => saveComment(p.sku, v)}
                          saving={commentSaving}
                        />
                      </td>
                      <td>
                        <span className={`badge ${status}`}><span className="badge-dot"/>&nbsp;{STATUS_LABELS[status] || status}</span>
                      </td>
                      <td><span className="sku">{p.sku}</span></td>
                      <td className="name-cell">
                        <div className="product-name">{p.name?.length > 30 ? p.name.slice(0,30)+"…" : p.name}</div>
                        {p.name?.length > 30 && <div className="tooltip">{p.name}</div>}
                      </td>
                      <td>
                        <span className={p.currentStock === 0 ? "num-danger" : p.currentStock < 10 ? "num-highlight" : "num"}>
                          {p.currentStock}
                        </span>
                      </td>
                      <td>
                        {p.daysRemaining === null
                          ? <span className="num" style={{color:"var(--text3)"}}>—</span>
                          : <span className={p.daysRemaining <= 7 ? "num-danger" : p.daysRemaining <= 30 ? "num-highlight" : "num-good"}>
                              {p.daysRemaining}d
                            </span>
                        }
                      </td>
                      <td>
                        <span className={`order-qty ${adjOrder > 0 ? orderClass : "zero"}`}>
                          {adjOrder > 0 ? adjOrder : "—"}
                        </span>
                      </td>
                      <td>
                        {p.stockValue > 0 ? (
                          <div style={{lineHeight:1.3}}>
                            <div className="num" style={{fontSize:13}}>₹{(p.stockValue).toLocaleString("en-IN")}</div>
                            <div style={{fontSize:10,color:"var(--text3)"}}>
                              {data.summary.totalStockValue ? Math.round(100*p.stockValue/data.summary.totalStockValue*100)/100 : 0}%
                            </div>
                          </div>
                        ) : <span style={{color:"var(--text3)"}}>—</span>}
                      </td>
                      <td><span className="num">{p.netSales?.d7 ?? 0}</span></td>
                      <td><span className="num">{p.netSales?.d15 ?? 0}</span></td>
                      <td><span className="num">{p.netSales?.d30 ?? 0}</span></td>
                      <td><span className="num">{p.netSales?.d90 ?? 0}</span></td>
                      <td>
                        <div className="platform-wrap">
                          {(p.platformSales?.amazon > 0) && <span className="platform-pill amazon">AM {p.platformSales.amazon}</span>}
                          {(p.platformSales?.amazon_vendor > 0) && <span className="platform-pill amazon_vendor">AV {p.platformSales.amazon_vendor}</span>}
                          {(p.platformSales?.flipkart > 0) && <span className="platform-pill flipkart">FL {p.platformSales.flipkart}</span>}
                          {(p.platformSales?.myntra > 0) && <span className="platform-pill myntra">MY {p.platformSales.myntra}</span>}
                          {(p.platformSales?.ajio > 0) && <span className="platform-pill ajio">AJ {p.platformSales.ajio}</span>}
                          {(p.platformSales?.others > 0) && <span className="platform-pill others">OT {p.platformSales.others}</span>}
                          {(p.platformSales?.global > 0) && <span className="platform-pill global">GL {p.platformSales.global}</span>}
                          {(!p.platformSales?.amazon && !p.platformSales?.amazon_vendor && !p.platformSales?.flipkart && !p.platformSales?.myntra && !p.platformSales?.ajio && !p.platformSales?.global && !p.platformSales?.others) && <span style={{color:"var(--text3)",fontSize:12}}>—</span>}
                        </div>
                      </td>
                      <td><span className={p.returns?.d30 > 0 ? "num-danger" : "num"}>{p.returns?.d30 ?? 0}</span></td>
                      <td><span className="num">{p.dailyVelocity}</span></td>
                      <td style={{textAlign:"right",paddingRight:16}}>
                        <button
                          className="btn-eol"
                          title="Mark as End of Life — hide from main table"
                          onClick={() => toggleEol(p.sku)}
                          disabled={eolSaving}>
                          EOL
                        </button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </>
      )}

      {/* EOL Products Block */}
      {!loading && data && eolProducts.length > 0 && (
        <EolBlock products={eolProducts} toggleEol={toggleEol} eolSaving={eolSaving} />
      )}

      {/* Inventory Value Trend Chart */}
      {!loading && data && <TrendChart/>}

      {!loading && !data && !error && (
        <div className="loading">
          <div className="loading-text" style={{fontSize:16}}>Ready to fetch. Click Refresh to load stock data.</div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
